name: SmartCallGuard

options:
  bundleIdPrefix: com.uland.smartcallguard
  deploymentTarget:
    iOS: "16.0"

targets:
  SmartCallGuard:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uland.smartcallguard
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
