name: Deploy IPA

on:
  push:
    branches: [master]
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'project.yml'
      - '.github/workflows/deploy-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build and Export IPA (Development)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SmartCallGuard.xcodeproj \
            -scheme SmartCallGuard

      - name: Setup Keychain (for automatic signing)
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Build (unsigned — Sideloadly signs locally)
        run: |
          xcodebuild build \
            -project SmartCallGuard.xcodeproj \
            -scheme SmartCallGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA (manual — unsigned)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/SmartCallGuard.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH" >&2
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SmartCallGuard.ipa Payload/
          echo "IPA size: $(wc -c < SmartCallGuard.ipa) bytes" 

      - name: Verify IPA
        run: |
          ls -la SmartCallGuard.ipa
          echo "IPA size: $(wc -c < SmartCallGuard.ipa) bytes"
          if [ ! -s SmartCallGuard.ipa ]; then
            echo "ERROR: IPA is empty!" >&2
            exit 1
          fi
          echo "✅ IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCallGuard.ipa
          path: SmartCallGuard.ipa
          retention-days: 7